<!DOCTYPE html>
<html>
<head>
  <title>Data Guru</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container p-5">
  <h2>Data Guru</h2>
  <form method="POST" class="mb-3">
    <input type="text" name="nama" placeholder="Nama" required class="form-control mb-2">
    <input type="text" name="nip" placeholder="NIP" required class="form-control mb-2">
    <button type="submit" class="btn btn-primary">Tambah Guru</button>
  </form>

  <table class="table table-bordered">
    <tr><th>Nama</th><th>NIP</th><th>QR Code Hari Ini</th></tr>
    {% for g in data %}
    <tr>
      <td>{{ g[0] }}</td>
      <td>{{ g[1] }}</td>
      <td>
        <img src="{{ g[2] }}" width="100"><br>
        <small>Scan → /absensi/{{ g[3] }}</small>
      </td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
