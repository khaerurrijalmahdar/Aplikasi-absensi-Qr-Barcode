<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Guru</title>
<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        margin: 0;
        background-color: #f0f4f7;
        text-align: center;
    }
    h2 {
        color: #333;
    }
    img.qr {
        width: 250px;
        height: 250px;
        margin: 20px 0;
    }
    a.logout {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 20px;
        background-color: #dc3545;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-size: 16px;
    }
    a.logout:hover {
        background-color: #b52a37;
    }
</style>
</head>
<body>
    <h2>Halo, {{ nama }} (NIP: {{ nip }})</h2>
    <p>QR Code Absensi Global:</p>
    <img src="{{ url_for('static', filename='qrcode/' + qr_filename) }}" class="qr">
    <p><a href="{{ url_for('logout') }}" class="logout">Logout</a></p>
</body>
</html>
