<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tambah Guru</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-3" style="max-width:600px;">
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-link">← Kembali</a>
    <div class="card">
      <div class="card-body">
        <h4 class="mb-3">Tambah Guru</h4>
        {% if msg %}
        <div class="alert alert-warning">{{ msg }}</div>
        {% endif %}
        <form method="POST">
          <div class="mb-2"><input class="form-control" name="nama" placeholder="Nama Guru" required></div>
          <div class="mb-2"><input class="form-control" name="nip" placeholder="NIP" required></div>
          <div class="mb-2"><input class="form-control" name="username" placeholder="Username login" required></div>
          <div class="mb-2"><input class="form-control" name="password" type="password" placeholder="Password" required></div>
          <button class="btn btn-success w-100" type="submit">Simpan</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
